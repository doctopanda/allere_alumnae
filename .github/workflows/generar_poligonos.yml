name: Construir polígonos municipales de Sonora
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generar_poligonos.yml"
      - "scripts/generar_poligonos.py"
permissions:
  contents: write
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check shapely==2.0.7
      - name: Descargar, verificar, simplificar a 72 municipios
        run: python scripts/generar_poligonos.py
      - name: Publicar GeoJSON generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/municipios_sonora.geojson data/municipios_fuente.json
          git diff --cached --quiet || (git commit -m "Actualizar 72 polígonos municipales simplificados de Sonora" && git push)
