name: Censo INEGI 2020 · AGEB 0–4 Sonora
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ageb:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Descargar y auditar información censal oficial
        run: python scripts/inegi_ageb_2020.py
      - name: Publicar únicamente agregados INEGI 2020
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inegi_ageb_2020_0_4.json
          git diff --cached --quiet || (git commit -m "Publicar población de 0–4 INEGI 2020 por AGEB urbana de Sonora" && git push)